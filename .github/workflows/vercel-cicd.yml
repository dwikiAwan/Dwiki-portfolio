name: Vercel CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  ci-cd-deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. Download kode dari repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup environment Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # 3. Step CI: Install Dependencies & Run Testing
      - name: Install Dependencies
        run: npm ci

      - name: Run Linter / Testing (CI)
        run: |
          # Jalankan test/lint jika ada di package.json
          npm run lint --if-present
          npm test --if-present

      # 4. Step CD: Pull environment & Build Vercel Artifacts
      - name: Pull Vercel Environment Information
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build Project Artifacts
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx vercel build --prod --token="$VERCEL_TOKEN"

      # 5. Step CD: Deploy ke Production Vercel
      - name: Deploy Project Artifacts to Vercel
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          # Output `vercel deploy` berisi baris log + URL di akhir; ambil baris
          # terakhir dan buang kode warna ANSI supaya URL-nya bersih.
          RAW=$(npx vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          DEPLOY_URL=$(printf '%s\n' "$RAW" | sed -e 's/\x1b\[[0-9;]*m//g' | tail -n 1)
          echo "DEPLOY_URL=$DEPLOY_URL" >> "$GITHUB_ENV"

      # 6. Notifikasi Telegram (Jika Sukses)
      # Pola yang sama: nilai event masuk lewat env, JSON dirakit dengan jq.
      - name: Send Telegram Success Notification
        if: success()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_TO }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          DEPLOY_URL: ${{ env.DEPLOY_URL }}
        run: |
          set -euo pipefail
          FIRST_LINE=$(printf '%s' "$COMMIT_MSG" | head -n 1)

          TEXT=$(printf '✅ *Vercel Deployment Success!*\n\n📦 *Repo:* `%s`\n🌿 *Branch:* `%s`\n📝 *Commit:* %s\n🔗 *URL:* %s' \
            "$REPO" "$BRANCH" "$FIRST_LINE" "$DEPLOY_URL")

          PAYLOAD=$(jq -n \
            --arg chat_id "$CHAT_ID" \
            --arg text "$TEXT" \
            '{chat_id: $chat_id, text: $text, parse_mode: "Markdown"}')

          STATUS=$(curl -sS -o /tmp/tg-response.json -w '%{http_code}' \
            -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            --data-binary "$PAYLOAD")

          if [ "$STATUS" != "200" ]; then
            echo "::error::Telegram API menolak dengan HTTP $STATUS"
            jq -r '.description // "tanpa deskripsi"' /tmp/tg-response.json || true
            exit 1
          fi

      # 7. Notifikasi Telegram (Jika Gagal / Build Error)
      - name: Send Telegram Failure Notification
        if: failure()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_TO }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          FIRST_LINE=$(printf '%s' "$COMMIT_MSG" | head -n 1)

          TEXT=$(printf '❌ *Vercel Deployment Failed!*\n\n📦 *Repo:* `%s`\n🌿 *Branch:* `%s`\n📝 *Commit:* %s\n⚠️ _Periksa tab Actions di GitHub untuk detail log error._' \
            "$REPO" "$BRANCH" "$FIRST_LINE")

          PAYLOAD=$(jq -n \
            --arg chat_id "$CHAT_ID" \
            --arg text "$TEXT" \
            '{chat_id: $chat_id, text: $text, parse_mode: "Markdown"}')

          STATUS=$(curl -sS -o /tmp/tg-response.json -w '%{http_code}' \
            -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            --data-binary "$PAYLOAD")

          if [ "$STATUS" != "200" ]; then
            echo "::warning::Notifikasi gagal dijalankan (HTTP $STATUS)"
            jq -r '.description // "tanpa deskripsi"' /tmp/tg-response.json || true
          fi