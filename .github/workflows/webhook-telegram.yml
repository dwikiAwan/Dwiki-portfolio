name: Webhook Telegram Notification

on:
  push:
    branches: [ main, master ]
  deployment_status: # Menangkap status perubahan deployment dari Vercel

jobs:
  send-webhook:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Telegram Webhook
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_TO }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d '{
              "chat_id": "'"${CHAT_ID}"'",
              "text": "🔔 *Webhook Notifikasi GitHub*\n\n*Repo:* '${{ github.repository }}'\n*Branch:* '${{ github.ref_name }}'\n*Commit:* '${{ github.event.head_commit.message }}'\n*Pushed by:* '${{ github.actor }}'",
              "parse_mode": "Markdown"
            }'
